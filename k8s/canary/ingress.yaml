apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/actions.weighted: >
      {"type":"forward","forwardConfig":{"targetGroups":[
        {"serviceName":"rag-stable","servicePort":"80","weight":100},
        {"serviceName":"rag-canary","servicePort":"80","weight":0}]}}
    alb.ingress.kubernetes.io/actions.canary-only: >
      {"type":"forward","forwardConfig":{"targetGroups":[{"serviceName":"rag-canary","servicePort":"80"}]}}
    alb.ingress.kubernetes.io/conditions.canary-only: >
      [{"field":"http-header","httpHeaderConfig":{"httpHeaderName":"X-Canary","values":["1"]}}]
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: canary-only, port: { name: use-annotation } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: weighted, port: { name: use-annotation } } } }
