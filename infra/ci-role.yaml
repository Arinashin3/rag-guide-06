AWSTemplateFormatVersion: "2010-09-09"
Description: "Module3 Day2 (Lab 8): GitHub Actions OIDC role + EKS access entry for one student"

# NOTE: keep this file ASCII only. AWS CLI on Korean Windows reads it as cp949 and fails on UTF-8 Korean text.
# Prerequisite (instructor, once per account):
#   aws iam create-open-id-connect-provider --url https://token.actions.githubusercontent.com --client-id-list sts.amazonaws.com
# Prerequisite (student): stack rag-<num>-lab from Lab 1 (cluster + ECR repo) exists.

Parameters:
  Num:
    Type: String
    Description: student number, e.g. 00
  GitHubRepo:
    Type: String
    Description: "own GitHub repo as <owner>/<repo>, e.g. myid/rag-guide-00"
    AllowedPattern: "^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$"
  ClusterName:
    Type: String
    Default: ""
    Description: "leave empty to use rag-<num> (students do not change this)"

Conditions:
  UseDefaultCluster: !Equals [!Ref ClusterName, ""]

Resources:
  CiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "gh-rag-${Num}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
              StringLike:
                # GitHub sub is 'repo:<owner>/<repo>:...' or, with immutable IDs, 'repo:<owner>@<id>/<repo>@<id>:...'.
                # Accept both forms, limited to this one repository.
                "token.actions.githubusercontent.com:sub":
                  - !Sub
                    - "repo:${Owner}/${Repo}:*"
                    - { Owner: !Select [0, !Split ["/", !Ref GitHubRepo]], Repo: !Select [1, !Split ["/", !Ref GitHubRepo]] }
                  - !Sub
                    - "repo:${Owner}@*/${Repo}@*:*"
                    - { Owner: !Select [0, !Split ["/", !Ref GitHubRepo]], Repo: !Select [1, !Split ["/", !Ref GitHubRepo]] }
      Policies:
        - PolicyName: rag-ci
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: BedrockInvokeForEval
                Effect: Allow
                Action: ["bedrock:InvokeModel", "bedrock:InvokeModelWithResponseStream"]
                Resource: "*"
              - Sid: EcrLogin
                Effect: Allow
                Action: "ecr:GetAuthorizationToken"
                Resource: "*"
              - Sid: EcrPushOwnRepo
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:ListImages
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/rag-${Num}"
              - Sid: EksDescribeOwnCluster
                Effect: Allow
                Action: "eks:DescribeCluster"
                Resource: !Sub
                  - "arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${Cluster}"
                  - Cluster: !If [UseDefaultCluster, !Sub "rag-${Num}", !Ref ClusterName]

  CiAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !If [UseDefaultCluster, !Sub "rag-${Num}", !Ref ClusterName]
      PrincipalArn: !GetAtt CiRole.Arn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: "arn:aws:eks::aws:cluster-access-policy/AmazonEKSEditPolicy"
          AccessScope: { Type: namespace, Namespaces: [rag] }

Outputs:
  AwsRoleArn:
    Description: "value for GitHub Secret AWS_ROLE_ARN"
    Value: !GetAtt CiRole.Arn
  EcrRepo:
    Description: "value for GitHub Variable ECR_REPO"
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/rag-${Num}"
  EksCluster:
    Description: "value for GitHub Variable EKS_CLUSTER"
    Value: !If [UseDefaultCluster, !Sub "rag-${Num}", !Ref ClusterName]
